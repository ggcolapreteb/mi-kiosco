name: Actualizar noticias

# Este proceso se mantiene solo: cada ejecución actualiza las noticias cada 20 minutos
# durante unas 5 horas y, al terminar, deja encendida la siguiente (el "relevo").
# No depende del horario programado de GitHub, que resultó poco confiable.
# Si la cadena se corta, vigia.yml la vuelve a encender.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  models: read     # para los resúmenes con IA (GitHub Models)

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar cada 20 minutos
        env:
          IA_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kiosco-bot"
          git config user.email "kiosco-bot@users.noreply.github.com"
          FIN=$(( $(date +%s) + 5 * 3600 ))
          while true; do
            git pull -q --rebase origin main || true
            python actualizar.py || true
            git add data.json resumenes.json 2>/dev/null || git add data.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualiza noticias"
              git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
            fi
            if [ "$(date +%s)" -ge "$FIN" ]; then break; fi
            sleep 1200
          done
      - name: Relevo
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run actualizar.yml --repo "$GITHUB_REPOSITORY" --ref main
