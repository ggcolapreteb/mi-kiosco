name: Actualizar noticias

on:
  schedule:
    - cron: "7,27,47 * * * *"   # cada 20 minutos (GitHub puede atrasarse algunos minutos)
  workflow_dispatch:             # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer los feeds
        run: python actualizar.py
      - name: Guardar data.json
        run: |
          git config user.name "kiosco-bot"
          git config user.email "kiosco-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualiza noticias"
          git push
