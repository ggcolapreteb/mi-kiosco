name: Probar IA

on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Catálogo y pedido de prueba
        env:
          IA_TOKEN: ${{ github.token }}
        run: |
          B='{"max_tokens":60,"messages":[{"role":"user","content":"Di hola en una palabra"}],"model":"MODELO"}'
          probar() { # url modelo
            echo "== $1 [$2]"
            curl -sS -L -D cab.txt -o resp.txt -w "HTTP %{http_code} %{content_type} %{size_download} final=%{url_effective}\n" -H "Authorization: Bearer $IA_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" "$1" -d "${B/MODELO/$2}" || true
            grep -i "^HTTP\|ratelimit\|location\|server:\|x-github" cab.txt || true
            head -c 500 resp.txt; echo
          }
          probar https://models.github.ai/inference/chat/completions openai/gpt-4o-mini
          probar https://models.inference.ai.azure.com/chat/completions gpt-4o-mini
          probar https://models.inference.ai.azure.com/chat/completions gpt-4.1-mini
          echo "== catálogo azure"; curl -sS -w "HTTP %{http_code}\n" -H "Authorization: Bearer $IA_TOKEN" https://models.inference.ai.azure.com/models -o m.json || true; head -c 400 m.json; echo
          echo "== resolución"; getent hosts models.github.ai || true; curl -sS -o /dev/null -w "%{remote_ip}\n" https://models.github.ai/ || true
